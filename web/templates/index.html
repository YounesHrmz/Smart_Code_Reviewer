{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col_md_8 text-center">
        <h1 class="display-5 mb-3 fw-bold text-secondary">حلل كودك برمجياً وبذكاء محلي</h1>
        <p class="lead text-muted mb-5">ارفع ملف كود بايثون (.py) الخاص بك ليقوم النظام بفحصه أمنياً وبنائياً مع ميزة التطوير التلقائي لقاعدة البيانات.</p>
        
        <div class="card p-5 bg-white rounded-3 shadow">
            <form action="/review" method="POST" enctype="multipart/form-data">
                <div class="mb-4">
                    <label for="code_file" class="form-label fw-bold">اختر ملف بايثون للفحص</label>
                    <input class="form-control form-control-lg" type="file" id="code_file" name="code_file" accept=".py" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg px-5">ابدأ التحليل الذكي الآن</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
