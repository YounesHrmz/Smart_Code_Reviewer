<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Local Source Code Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: rgba(255,255,255,0.78);
            --text: #132238;
            --muted: #678;
            --border: rgba(20,40,60,0.08);
            --accent: #4c6ef5;
            --accent-2: #14b8a6;
            --danger: #ff5d7a;
            --warning: #f59e0b;
        }
        body[data-theme="dark"] {
            --bg: #07111f;
            --card: rgba(13,23,38,0.9);
            --text: #edf4ff;
            --muted: #8fa8c7;
            --border: rgba(255,255,255,0.08);
            --accent: #79a2ff;
            --accent-2: #56d7c7;
            --danger: #ff7a93;
            --warning: #ffc96b;
        }
        body {
            background: linear-gradient(135deg, var(--bg), rgba(76,110,245,0.08));
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
        }
        .glass-card {
            background: var(--card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(15,23,42,0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .glass-card:hover { transform: translateY(-2px); box-shadow: 0 22px 55px rgba(15,23,42,0.12); }
        .hero-ring { background: radial-gradient(circle at top, rgba(76,110,245,0.18), transparent 55%); }
        .btn-immersive { border-radius: 999px; padding: 0.7rem 1.2rem; }
        .chip { border-radius: 999px; padding: 0.35rem 0.75rem; font-size: 0.8rem; }
        .table thead th { vertical-align: middle; }
        .severity-critical { border-left: 6px solid var(--danger); background-color: rgba(255,93,122,0.08); }
        .severity-warning { border-left: 6px solid var(--warning); background-color: rgba(245,158,11,0.08); }
        .severity-safe { border-left: 6px solid var(--accent-2); background-color: rgba(20,184,166,0.08); }
        .theme-toggle { cursor: pointer; border: none; background: rgba(255,255,255,0.12); color: white; border-radius: 999px; padding: 0.35rem 0.8rem; }
        .soft-list li { margin-bottom: 0.45rem; }
        .fade-in { animation: fadeIn 0.45s ease both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
    </style>
</head>
<body data-theme="light">
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 px-4 shadow" style="background: linear-gradient(90deg, #0f172a, #172554);">
        <a class="navbar-brand fw-bold" href="/">🔬 Intelligent Local Source Code Analyzer</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <span class="chip bg-white text-dark">Autonomous Learning Pipeline Active</span>
            <button class="theme-toggle" onclick="toggleTheme()">🌙/☀️</button>
        </div>
    </nav>
    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>
    <script>
        function toggleTheme() {
            const body = document.body;
            const next = body.dataset.theme === 'dark' ? 'light' : 'dark';
            body.dataset.theme = next;
            localStorage.setItem('theme', next);
        }
        const saved = localStorage.getItem('theme');
        if (saved) document.body.dataset.theme = saved;
    </script>
</body>
</html>
