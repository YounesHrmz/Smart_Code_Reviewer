<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Local Source Code Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ========== THEME COLOR VARIABLES ========== */
        :root {
            /* Light Mode Palette */
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --surface-default: #ffffff;
            --surface-elevated: #ffffff;
            --surface-muted: #f8fafc;
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #64748b;
            --text-muted: #94a3b8;
            
            --border-default: #e2e8f0;
            --border-subtle: #cbd5e1;
            
            --accent-primary: #4f46e5;
            --accent-secondary: #06b6d4;
            --accent-tertiary: #8b5cf6;
            
            --semantic-danger: #dc2626;
            --semantic-warning: #ea580c;
            --semantic-success: #16a34a;
            --semantic-info: #0284c7;
            
            --code-bg: #f8fafc;
            --code-text: #0f172a;
            
            --input-bg: #ffffff;
            --input-border: #e2e8f0;
            --input-border-focus: #4f46e5;
            --input-text: #0f172a;
            --input-placeholder: #94a3b8;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Dark Mode Palette */
        body[data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #0d1b2a;
            --surface-default: #1e293b;
            --surface-elevated: #1e293b;
            --surface-muted: #0f172a;
            
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
            --text-muted: #64748b;
            
            --border-default: #334155;
            --border-subtle: #475569;
            
            --accent-primary: #818cf8;
            --accent-secondary: #22d3ee;
            --accent-tertiary: #c084fc;
            
            --semantic-danger: #ef4444;
            --semantic-warning: #f97316;
            --semantic-success: #22c55e;
            --semantic-info: #06b6d4;
            
            --code-bg: #0f172a;
            --code-text: #e2e8f0;
            
            --input-bg: #1e293b;
            --input-border: #334155;
            --input-border-focus: #818cf8;
            --input-text: #f8fafc;
            --input-placeholder: #64748b;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        
        /* ========== GLOBAL STYLES ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color var(--transition-slow), color var(--transition-slow);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Background gradient ornamentation */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.1;
            pointer-events: none;
            z-index: -1;
        }
        
        body::before {
            top: -200px;
            right: -200px;
            background: var(--accent-primary);
            animation: floatBlob 12s ease-in-out infinite;
        }
        
        body::after {
            bottom: -200px;
            left: -200px;
            background: var(--accent-secondary);
            animation: floatBlob 12s ease-in-out infinite 3s;
        }
        
        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
        }
        
        /* ========== NAVBAR COMPONENT ========== */
        .navbar-shell {
            background-color: var(--surface-default);
            border-bottom: 1px solid var(--border-default);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(10px);
            transition: all var(--transition-base);
        }
        
        body[data-theme="dark"] .navbar-shell {
            background-color: rgba(30, 41, 59, 0.95);
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }
        
        .navbar-shell .navbar-brand {
            color: var(--text-primary) !important;
            font-weight: 700;
            font-size: 1.1rem;
            transition: color var(--transition-base);
        }
        
        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            margin-left: 0.5rem;
        }
        
        body[data-theme="dark"] .brand-mark {
            box-shadow: 0 4px 15px rgba(129, 140, 248, 0.2);
        }
        
        .soft-pill {
            border-radius: 9999px;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            background-color: var(--surface-muted);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            white-space: nowrap;
            transition: all var(--transition-base);
        }
        
        /* ========== THEME TOGGLE BUTTON ========== */
        .theme-toggle {
            cursor: pointer;
            border: 1px solid var(--border-default);
            background-color: var(--surface-muted);
            color: var(--text-primary);
            border-radius: 9999px;
            padding: 0.5rem 0.875rem;
            font-size: 1.1rem;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-weight: 600;
        }
        
        .theme-toggle:hover {
            background-color: var(--surface-default);
            border-color: var(--accent-primary);
            transform: scale(1.08);
            box-shadow: var(--shadow-md);
        }
        
        .theme-toggle:active {
            transform: scale(0.95);
        }
        
        /* ========== HERO SECTION ========== */
        .hero-panel {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), rgba(6, 182, 212, 0.08));
            border: 1px solid var(--border-default);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            transition: all var(--transition-base);
            padding: 2rem 1.5rem;
        }
        
        body[data-theme="dark"] .hero-panel {
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.05), rgba(34, 211, 238, 0.05));
            border-color: var(--border-default);
        }
        
        .hero-panel h1 {
            color: var(--text-primary);
            font-weight: 700;
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            line-height: 1.2;
        }
        
        .hero-panel p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        /* ========== FEATURE CARDS ========== */
        .feature-card {
            background-color: var(--surface-default);
            border: 1px solid var(--border-default);
            border-radius: 16px;
            padding: 1.5rem;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-sm);
        }
        
        .feature-card:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        
        .feature-card h6 {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .feature-card small {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.5;
        }
        
        /* ========== METRIC CARDS ========== */
        .metric-card {
            background-color: var(--surface-default);
            border: 1px solid var(--border-default);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            transition: all var(--transition-base);
        }
        
        .metric-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        
        .metric-card h6 {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .metric-card h1,
        .metric-card h2 {
            color: var(--text-primary);
            font-weight: 700;
            margin: 0.5rem 0 0 0;
        }
        
        /* ========== GLASS CARD (UNIVERSAL) ========== */
        .glass-card {
            background-color: var(--surface-default);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-default);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            transition: all var(--transition-base);
            color: var(--text-primary);
        }
        
        .glass-card:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-xl);
            transform: translateY(-2px);
        }
        
        .glass-card h4,
        .glass-card h5,
        .glass-card h6 {
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .glass-card p,
        .glass-card small {
            color: var(--text-secondary);
        }
        
        /* ========== FORM ELEMENTS ========== */
        .form-control,
        .form-select {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--input-text);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all var(--transition-base);
        }
        
        .form-control::placeholder {
            color: var(--input-placeholder);
        }
        
        .form-control:focus,
        .form-select:focus {
            border-color: var(--input-border-focus);
            background-color: var(--input-bg);
            color: var(--input-text);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        
        body[data-theme="dark"] .form-control:focus,
        body[data-theme="dark"] .form-select:focus {
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.1);
        }
        
        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }
        
        /* ========== BUTTONS ========== */
        .btn {
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            font-size: 1rem;
            transition: all var(--transition-base);
            border: none;
            cursor: pointer;
        }
        
        .btn-dark {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
            color: white;
            box-shadow: var(--shadow-md);
        }
        
        .btn-dark:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .btn-dark:active {
            transform: translateY(0);
        }
        
        .btn-immersive {
            border-radius: 9999px;
            padding: 0.875rem 2rem;
            font-weight: 600;
            font-size: 1rem;
        }
        
        .btn-outline-dark {
            border: 2px solid var(--text-primary);
            color: var(--text-primary);
            background-color: transparent;
        }
        
        .btn-outline-dark:hover {
            background-color: var(--text-primary);
            color: var(--bg-primary);
        }
        
        /* ========== BADGE/CHIP ELEMENTS ========== */
        .chip {
            border-radius: 9999px;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-block;
            transition: all var(--transition-base);
        }
        
        .chip.bg-primary {
            background-color: var(--accent-primary);
            color: white;
        }
        
        .chip.bg-success {
            background-color: var(--semantic-success);
            color: white;
        }
        
        .chip.bg-warning {
            background-color: var(--semantic-warning);
            color: white;
        }
        
        .chip.bg-info {
            background-color: var(--semantic-info);
            color: white;
        }
        
        .badge {
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all var(--transition-base);
        }
        
        /* ========== ALERTS ========== */
        .alert {
            border: 1px solid;
            border-radius: 12px;
            padding: 1rem;
            transition: all var(--transition-base);
        }
        
        .alert-info {
            background-color: rgba(2, 132, 199, 0.1);
            border-color: var(--semantic-info);
            color: var(--text-primary);
        }
        
        body[data-theme="dark"] .alert-info {
            background-color: rgba(6, 182, 212, 0.1);
        }
        
        .alert-danger {
            background-color: rgba(220, 38, 38, 0.1);
            border-color: var(--semantic-danger);
            color: var(--text-primary);
        }
        
        body[data-theme="dark"] .alert-danger {
            background-color: rgba(239, 68, 68, 0.1);
        }
        
        /* ========== TABLES ========== */
        .table-modern {
            color: var(--text-primary);
            border-collapse: collapse;
        }
        
        .table-modern thead th {
            background-color: var(--surface-muted);
            color: var(--text-primary);
            font-weight: 600;
            border-bottom: 2px solid var(--border-default);
            padding: 1rem;
            text-align: left;
            vertical-align: middle;
        }
        
        .table-modern tbody tr {
            border-bottom: 1px solid var(--border-default);
            transition: all var(--transition-base);
        }
        
        .table-modern tbody tr:hover {
            background-color: var(--surface-muted);
        }
        
        .table-modern tbody td {
            padding: 1rem;
            color: var(--text-primary);
        }
        
        /* ========== SEVERITY INDICATORS ========== */
        .severity-critical {
            border-left: 4px solid var(--semantic-danger);
            background-color: rgba(220, 38, 38, 0.05);
        }
        
        body[data-theme="dark"] .severity-critical {
            background-color: rgba(239, 68, 68, 0.08);
        }
        
        .severity-warning {
            border-left: 4px solid var(--semantic-warning);
            background-color: rgba(234, 88, 12, 0.05);
        }
        
        body[data-theme="dark"] .severity-warning {
            background-color: rgba(249, 115, 22, 0.08);
        }
        
        .severity-safe {
            border-left: 4px solid var(--semantic-success);
            background-color: rgba(22, 163, 74, 0.05);
        }
        
        body[data-theme="dark"] .severity-safe {
            background-color: rgba(34, 197, 94, 0.08);
        }
        
        /* ========== CODE BLOCKS ========== */
        code {
            background-color: var(--code-bg);
            color: var(--code-text);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        pre {
            background-color: var(--code-bg);
            color: var(--code-text);
            border: 1px solid var(--border-default);
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
        }
        
        pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
            border-radius: 0;
        }
        
        /* ========== TEXT UTILITIES ========== */
        .text-primary {
            color: var(--text-primary) !important;
        }
        
        .text-secondary {
            color: var(--text-secondary) !important;
        }
        
        .text-muted {
            color: var(--text-muted) !important;
        }
        
        /* ========== ANIMATION ========== */
        .fade-in {
            animation: fadeInUp 0.5s ease-out both;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .glass-card,
            .hero-panel {
                border-radius: 16px;
            }
            
            .btn-immersive {
                padding: 0.75rem 1.5rem;
                font-size: 0.95rem;
            }
            
            .feature-card {
                min-height: 100px;
            }
        }
    </style>
</head>
<body data-theme="light">
    <nav class="navbar navbar-expand-lg navbar-light mb-4 px-4 navbar-shell">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
            <span class="brand-mark">⌘</span>
            <span>Code Analyzer</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="soft-pill">🤖 Autonomous Learning</span>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle Dark/Light Mode">
                <span class="theme-icon">☀️</span>
            </button>
        </div>
    </nav>
    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>
    <script>
        /**
         * Modern Dark/Light Theme Management System
         * Features:
         * - System preference detection (prefers-color-scheme)
         * - localStorage persistence
         * - Smooth theme transitions
         * - Icon updates for theme state
         */
        
        const THEME_KEY = 'app-theme-preference';
        const LIGHT_THEME = 'light';
        const DARK_THEME = 'dark';
        
        // Theme configuration
        const ThemeManager = {
            // Get current theme from DOM
            getCurrent() {
                return document.body.dataset.theme || LIGHT_THEME;
            },
            
            // Set theme on DOM and update UI
            set(theme) {
                const isValid = [LIGHT_THEME, DARK_THEME].includes(theme);
                const themeToSet = isValid ? theme : LIGHT_THEME;
                
                document.body.dataset.theme = themeToSet;
                localStorage.setItem(THEME_KEY, themeToSet);
                
                // Update theme icon
                this.updateIcon(themeToSet);
                
                // Dispatch custom event for other scripts to listen
                window.dispatchEvent(new CustomEvent('themechange', { 
                    detail: { theme: themeToSet } 
                }));
            },
            
            // Update the toggle button icon
            updateIcon(theme) {
                const icon = document.querySelector('.theme-icon');
                if (icon) {
                    icon.textContent = theme === DARK_THEME ? '☀️' : '🌙';
                }
            },
            
            // Get user's system preference
            getSystemPreference() {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    return DARK_THEME;
                }
                return LIGHT_THEME;
            },
            
            // Initialize theme on page load
            init() {
                let theme;
                
                // Priority: stored preference > system preference > default
                const stored = localStorage.getItem(THEME_KEY);
                if (stored && [LIGHT_THEME, DARK_THEME].includes(stored)) {
                    theme = stored;
                } else {
                    theme = this.getSystemPreference();
                }
                
                this.set(theme);
            },
            
            // Toggle between light and dark
            toggle() {
                const current = this.getCurrent();
                const next = current === DARK_THEME ? LIGHT_THEME : DARK_THEME;
                this.set(next);
            }
        };
        
        // Global function for HTML onclick
        function toggleTheme() {
            ThemeManager.toggle();
        }
        
        // Initialize theme when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => ThemeManager.init());
        } else {
            ThemeManager.init();
        }
        
        // Listen for system theme preference changes
        if (window.matchMedia) {
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            mediaQuery.addListener((e) => {
                // Only apply if user hasn't manually set preference
                if (!localStorage.getItem(THEME_KEY)) {
                    ThemeManager.set(e.matches ? DARK_THEME : LIGHT_THEME);
                }
            });
        }
    </script>
</body>
</html>
