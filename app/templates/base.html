<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Local Source Code Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f3f6ff;
            --surface: rgba(255,255,255,0.84);
            --surface-strong: rgba(255,255,255,0.95);
            --text: #15223b;
            --muted: #60708f;
            --border: rgba(20,40,60,0.09);
            --accent: #4f46e5;
            --accent-2: #14b8a6;
            --accent-3: #8b5cf6;
            --danger: #ef476f;
            --warning: #f59e0b;
            --success: #22c55e;
        }
        body[data-theme="dark"] {
            --bg: #07111f;
            --surface: rgba(10,18,32,0.88);
            --surface-strong: rgba(13,23,38,0.95);
            --text: #edf4ff;
            --muted: #8fa8c7;
            --border: rgba(255,255,255,0.08);
            --accent: #7c93ff;
            --accent-2: #56d7c7;
            --accent-3: #b48cff;
            --danger: #ff7a93;
            --warning: #ffcb6b;
            --success: #5ee7a6;
        }
        * { box-sizing: border-box; }
        body {
            background:
                radial-gradient(circle at top right, rgba(79,70,229,0.14), transparent 24%),
                radial-gradient(circle at bottom left, rgba(20,184,166,0.16), transparent 30%),
                linear-gradient(135deg, var(--bg), #edf2ff);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before, body::after {
            content: "";
            position: fixed;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.16;
            pointer-events: none;
            animation: floatBlob 10s ease-in-out infinite;
        }
        body::before { top: -90px; right: -90px; background: var(--accent); }
        body::after { bottom: -100px; left: -100px; background: var(--accent-2); animation-delay: 3s; }
        .navbar-shell {
            background: linear-gradient(90deg, #0f172a, #172554 55%, #1e3a8a);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 12px 40px rgba(2,6,23,0.24);
        }
        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(79,70,229,0.25);
        }
        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 18px 48px rgba(15,23,42,0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .glass-card:hover { transform: translateY(-2px); box-shadow: 0 22px 60px rgba(15,23,42,0.12); }
        .hero-panel {
            background: linear-gradient(135deg, rgba(79,70,229,0.12), rgba(20,184,166,0.10));
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 30px 70px rgba(15,23,42,0.08);
        }
        .feature-card {
            border-radius: 18px;
            padding: 1rem;
            background: linear-gradient(145deg, var(--surface-strong), rgba(255,255,255,0.68));
            border: 1px solid var(--border);
            min-height: 112px;
        }
        .metric-card {
            border-radius: 18px;
            background: linear-gradient(145deg, var(--surface-strong), rgba(255,255,255,0.7));
            border: 1px solid var(--border);
        }
        .form-control, .btn, .alert, .table { transition: all 0.25s ease; }
        .form-control {
            border-radius: 14px;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(15,23,42,0.1);
        }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 0.2rem rgba(79,70,229,0.15); }
        .btn-dark {
            background: linear-gradient(90deg, #0f172a, #1d4ed8);
            border: none;
            box-shadow: 0 10px 25px rgba(30,64,175,0.2);
        }
        .btn-immersive {
            border-radius: 999px;
            padding: 0.75rem 1.25rem;
            font-weight: 600;
        }
        .soft-pill {
            border-radius: 999px;
            padding: 0.4rem 0.8rem;
            font-size: 0.82rem;
            color: white;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.16);
        }
        .chip {
            border-radius: 999px;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .theme-toggle {
            cursor: pointer;
            border: none;
            background: rgba(255,255,255,0.14);
            color: white;
            border-radius: 999px;
            padding: 0.4rem 0.8rem;
            border: 1px solid rgba(255,255,255,0.16);
        }
        .table-modern thead th {
            vertical-align: middle;
            background: linear-gradient(90deg, #0f172a, #1e293b);
            color: #fff !important;
        }
        .table-modern tbody tr {
            background: rgba(255,255,255,0.55);
            border-bottom: 1px solid rgba(15,23,42,0.06);
        }
        .table-modern tbody tr:hover {
            background: rgba(255,255,255,0.75);
        }
        .severity-critical { border-right: 6px solid var(--danger); background-color: rgba(239,71,111,0.08); }
        .severity-warning { border-right: 6px solid var(--warning); background-color: rgba(245,158,11,0.08); }
        .severity-safe { border-right: 6px solid var(--success); background-color: rgba(34,197,94,0.08); }
        .soft-list li { margin-bottom: 0.45rem; }
        .fade-in { animation: fadeIn 0.45s ease both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
        @keyframes floatBlob { 0%,100% { transform: translateY(0px) scale(1);} 50% { transform: translateY(20px) scale(1.06);} }
    </style>
</head>
<body data-theme="light">
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 px-4 navbar-shell">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
            <span class="brand-mark">⌘</span>
            <span>Intelligent Local Source Code Analyzer</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <span class="soft-pill">Autonomous Learning Pipeline Active</span>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="تبديل الثيم">🌙 / ☀️</button>
        </div>
    </nav>
    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>
    <script>
        function toggleTheme() {
            const body = document.body;
            const next = body.dataset.theme === 'dark' ? 'light' : 'dark';
            body.dataset.theme = next;
            localStorage.setItem('theme', next);
        }
        const saved = localStorage.getItem('theme');
        if (saved) document.body.dataset.theme = saved;
    </script>
</body>
</html>
