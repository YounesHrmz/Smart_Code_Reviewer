{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-lg-8 text-center">
        <h1 class="display-6 fw-bold text-dark mb-2">تحليل ومراجعة الشيفرات البرمجية محلياً وبذكاء ذاتي</h1>
        <p class="lead text-muted mb-4">ارفع ملف بايثون ليقوم النظام بالفحص الشامل للهيكل الداخلي مع دعم حلقة التعلم الآلي المستمر.</p>

        <div class="card p-4 p-md-5 bg-white shadow-sm">
            <form action="/review" method="POST" enctype="multipart/form-data">
                <div class="mb-4">
                    <label for="code_file" class="form-label fw-bold text-secondary fs-5">اختر ملف البايثون المستهدف (.py)</label>
                    <input class="form-control form-control-lg border-2" type="file" id="code_file" name="code_file" accept=".py" required>
                </div>
                <button type="submit" class="btn btn-dark btn-lg px-5 shadow-sm fw-bold">ابدأ التحليل</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
